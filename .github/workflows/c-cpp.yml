name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    # SDL3 is not packaged in Ubuntu 24.04 (the current ubuntu-latest image),
    # so build inside Debian trixie, which ships libsdl3-dev (and taglib 2,
    # which configure's `taglib >= 1.6` check accepts).
    container: debian:trixie

    env:
      # mold links this tree several times over -- once per check program,
      # and again inside distcheck -- and it is markedly faster at it than
      # GNU ld. Exported rather than passed to configure so that distcheck's
      # own configure, which runs as a child of this one, uses it too.
      LDFLAGS: -fuse-ld=mold
      # Most test sources do not change from one push to the next, and both
      # `check` and `distcheck` compile all of them; ccache makes the second
      # compile of an unchanged file free, within a run and across runs.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1500M
      # distcheck builds in a tree of its own under the workspace, and with
      # -g the compiler records the path a file was compiled in, so ccache
      # hashes that path as well and the same source compiled in the two
      # trees misses. These two make the paths stop mattering: measured in
      # the CI image, the second tree goes from no hits to all of them. The
      # cost is that a cached object carries the directory recorded when it
      # was first compiled, which for a CI artifact is of no consequence.
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"

    steps:
    - name: Install dependencies
      run: |
        # libfdk-aac-dev is in Debian's non-free component, which the official
        # image does not enable. Ubuntu carries it in universe, which is on by
        # default, so this only matters here.
        if [ -f /etc/apt/sources.list.d/debian.sources ]; then
          sed -i 's/^Components: .*/Components: main contrib non-free non-free-firmware/' \
            /etc/apt/sources.list.d/debian.sources
        fi
        apt-get update
        apt-get install -y \
          build-essential \
          git \
          autoconf \
          automake \
          libtool \
          pkg-config \
          autoconf-archive \
          libsdl3-dev \
          libfreetype-dev \
          libharfbuzz-dev \
          libssl-dev \
          libcurl4-openssl-dev \
          libogg-dev \
          libvorbis-dev \
          libopus-dev \
          libfdk-aac-dev \
          libspeex-dev \
          libdbus-1-dev \
          dbus-daemon \
          zlib1g-dev \
          libflac-dev \
          flac \
          mold \
          ccache
        # taglib 2 renamed the -dev package; fall back for older suites.
        apt-get install -y libtag-dev || apt-get install -y libtag1-dev
        # No Qt/GTK on purpose: CI is the one build that exercises the
        # no-file-dialog configure path (local and Windows builds have Qt).
        # libflac-dev is NOT a decoder dependency (the native decoder needs no
        # libFLAC): the RFC 9639 compliance validator test uses its headers as
        # the reference-implementation type definitions.

    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Restore the compiler cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/.ccache
        # The newest cache of a previous run is restored and this run saves
        # its own; the key has to differ each time or the save is skipped.
        key: ccache-${{ github.sha }}
        restore-keys: |
          ccache-

    - name: Use ccache for the compilers
      run: |
        # Debian's ccache ships wrappers named gcc/g++/cc/c++; putting them
        # first in PATH means configure, make and distcheck all find them,
        # with no CC/CXX override to thread through the sub-builds.
        echo "/usr/lib/ccache" >> "$GITHUB_PATH"
        ccache --zero-stats

    - name: Generate configure script
      run: |
        autoreconf -fi
        echo "Configure script generated successfully"

    - name: Configure build
      run: |
        ./configure --enable-mpris
        echo "Build configured successfully"

    - name: Build project
      run: |
        make -j$(nproc)
        echo "Build completed successfully"

    - name: Generate FLAC test fixture
      run: |
        # The real-file FLAC tests skip without fixtures; give them a synthetic
        # one (10s of stereo noise) so that coverage actually runs in CI.
        mkdir -p tests/data
        head -c 1764000 /dev/urandom > /tmp/noise.raw
        flac --force-raw-format --channels=2 --bps=16 --sample-rate=44100 \
             --sign=signed --endian=little -o tests/data/fixture.flac /tmp/noise.raw
        ls -la tests/data/

    - name: Run tests (if any)
      id: tests
      # Collect ALL failures in one run instead of stopping at the first:
      # continue-on-error lets the later steps (distcheck, artifact upload)
      # still execute; the final gate step turns any recorded failure back
      # into a red job.
      continue-on-error: true
      run: |
        # `make -n check` failing means the check targets are broken -- a
        # program named in a Makefile that no longer exists, say -- not that
        # there are no tests. It used to be read as the latter, and a whole
        # run went by without the suite running at all.
        if ! make -n check >/dev/null 2>&1; then
          echo "::error::make -n check failed; the check targets are broken"
          make -n check >/dev/null || true
          exit 1
        fi
        if make -n check 2>/dev/null; then
          # The MPRIS tests need a session bus, which the container lacks.
          # make -k keeps going past a failing phase so the test suite (run
          # once, by the harness) and the top-level threading checks BOTH
          # report, rather than aborting at the first failing sub-target.
          # -j because `check` builds the ~300 test programs before running
          # them, and each one links the whole static stack: that build, not
          # the suite, is where this step's time goes (20 of 25 minutes, the
          # run itself under 5). The harness still runs them one at a time.
          dbus-run-session -- make -j$(nproc) -k check
          echo "Tests completed successfully"
        else
          echo "No tests available to run"
        fi

    - name: Check distribution packaging
      id: distcheck
      continue-on-error: true
      run: |
        if make -n distcheck 2>/dev/null; then
          # distcheck re-runs the whole test suite inside the dist tree, so it
          # needs the same session bus the 'Run tests' step gets - without it
          # the MPRIS tests can only skip (or, historically, fail).
          # It builds the sources and every test program again from the
          # unpacked tarball, and automake hands MAKEFLAGS to the sub-make, so
          # -j reaches that inner build too.
          dbus-run-session -- make -j$(nproc) distcheck
          echo "Distribution check completed successfully"
        else
          echo "Distribution check not available"
        fi

    - name: Compiler cache statistics
      if: always()
      run: ccache --show-stats --verbose | head -20

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: psymp3-build-${{ github.sha }}
        path: |
          src/psymp3
          **/*.log
        retention-days: 7

    - name: Report collected failures
      if: steps.tests.outcome == 'failure' || steps.distcheck.outcome == 'failure'
      run: |
        [ "${{ steps.tests.outcome }}" = "failure" ] && echo "::error::Test suite reported failures (see 'Run tests' step)"
        [ "${{ steps.distcheck.outcome }}" = "failure" ] && echo "::error::distcheck failed (see 'Check distribution packaging' step)"
        exit 1
