name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    # SDL3 is not packaged in Ubuntu 24.04 (the current ubuntu-latest image),
    # so build inside Debian trixie, which ships libsdl3-dev (and taglib 2,
    # which configure's `taglib >= 1.6` check accepts).
    container: debian:trixie

    steps:
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y \
          build-essential \
          git \
          autoconf \
          automake \
          libtool \
          pkg-config \
          autoconf-archive \
          libsdl3-dev \
          libfreetype-dev \
          libssl-dev \
          libcurl4-openssl-dev \
          libogg-dev \
          libvorbis-dev \
          libopus-dev \
          libfaad-dev \
          libspeex-dev \
          libspandsp-dev \
          libdbus-1-dev \
          dbus-daemon \
          zlib1g-dev \
          libflac-dev \
          flac
        # taglib 2 renamed the -dev package; fall back for older suites.
        apt-get install -y libtag-dev || apt-get install -y libtag1-dev
        # No Qt/GTK on purpose: CI is the one build that exercises the
        # no-file-dialog configure path (local and Windows builds have Qt).
        # libflac-dev is NOT a decoder dependency (the native decoder needs no
        # libFLAC): the RFC 9639 compliance validator test uses its headers as
        # the reference-implementation type definitions.

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Generate configure script
      run: |
        autoreconf -fi
        echo "Configure script generated successfully"

    - name: Configure build
      run: |
        ./configure --enable-mpris
        echo "Build configured successfully"

    - name: Build project
      run: |
        make -j$(nproc)
        echo "Build completed successfully"

    - name: Generate FLAC test fixture
      run: |
        # The real-file FLAC tests skip without fixtures; give them a synthetic
        # one (10s of stereo noise) so that coverage actually runs in CI.
        mkdir -p tests/data
        head -c 1764000 /dev/urandom > /tmp/noise.raw
        flac --force-raw-format --channels=2 --bps=16 --sample-rate=44100 \
             --sign=signed --endian=little -o tests/data/fixture.flac /tmp/noise.raw
        ls -la tests/data/

    - name: Run tests (if any)
      id: tests
      # Collect ALL failures in one run instead of stopping at the first:
      # continue-on-error lets the later steps (distcheck, artifact upload)
      # still execute; the final gate step turns any recorded failure back
      # into a red job.
      continue-on-error: true
      run: |
        if make -n check 2>/dev/null; then
          # The MPRIS tests need a session bus, which the container lacks.
          # make -k keeps going past a failing phase so the automake suite,
          # the harness re-run, and the top-level threading checks ALL
          # report, rather than aborting at the first failing sub-target.
          dbus-run-session -- make -k check
          echo "Tests completed successfully"
        else
          echo "No tests available to run"
        fi

    - name: Check distribution packaging
      id: distcheck
      continue-on-error: true
      run: |
        if make -n distcheck 2>/dev/null; then
          make distcheck
          echo "Distribution check completed successfully"
        else
          echo "Distribution check not available"
        fi

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: psymp3-build-${{ github.sha }}
        path: |
          src/psymp3
          **/*.log
        retention-days: 7

    - name: Report collected failures
      if: steps.tests.outcome == 'failure' || steps.distcheck.outcome == 'failure'
      run: |
        [ "${{ steps.tests.outcome }}" = "failure" ] && echo "::error::Test suite reported failures (see 'Run tests' step)"
        [ "${{ steps.distcheck.outcome }}" = "failure" ] && echo "::error::distcheck failed (see 'Check distribution packaging' step)"
        exit 1
