name: macOS app

# Builds a universal PsyMP3.app, and a .dmg holding it. Homebrew on each kind
# of Mac has only that kind's libraries, so each half is built on its own
# runner with package/mac/build-app.sh; package/mac/make-universal.sh then
# joins them with lipo. package/mac/check-app.sh checks each app starts,
# finds its data in its own Resources, loads FDK-AAC from inside the bundle,
# and quits when asked.

on:
  push:
    branches: [ "master" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: PsyMP3.app (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          # The oldest runners on offer: Homebrew builds its libraries for
          # the macOS it runs on, and the bundled libraries set the oldest
          # macOS each half will start on.
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v7

    - name: Build PsyMP3.app
      run: |
        set -eux
        ./package/mac/build-app.sh --deps

    - name: Verify the app runs
      run: ./package/mac/check-app.sh package/mac/out/PsyMP3.app

    # A tar keeps the bundle's executable bits and symlinks, which an
    # artifact upload of the directory would not.
    - name: Pack the app
      run: tar -C package/mac/out -cf PsyMP3-${{ matrix.arch }}.tar PsyMP3.app

    - uses: actions/upload-artifact@v7
      with:
        name: psymp3-app-${{ matrix.arch }}
        path: PsyMP3-${{ matrix.arch }}.tar
        if-no-files-found: error

  universal:
    name: PsyMP3.app (universal)
    needs: app
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v7

    - uses: actions/download-artifact@v7
      with:
        pattern: psymp3-app-*
        merge-multiple: true

    - name: Join the two apps
      run: |
        set -eux
        mkdir arm64 x86_64
        tar -C arm64 -xf PsyMP3-arm64.tar
        tar -C x86_64 -xf PsyMP3-x86_64.tar
        ./package/mac/make-universal.sh arm64/PsyMP3.app x86_64/PsyMP3.app

    - name: Verify both halves run
      run: |
        set -eux
        app=package/mac/out/PsyMP3.app
        test "$(lipo -archs "$app/Contents/MacOS/psymp3")" = "x86_64 arm64"
        ./package/mac/check-app.sh "$app" arm64
        # The Intel half, under Rosetta.
        ./package/mac/check-app.sh "$app" x86_64

    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: psymp3-macos
        path: package/mac/out/*.dmg
        if-no-files-found: error
